[project]
name = "glkvm-mcp"
version = "0.1.0"
description = "GLKVM MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "websockets>=12",
    "httpx>=0.27",
    "Pillow>=10",
    "pytesseract>=0.3.13",
    "python-dotenv>=1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
start = {cmd = "python glkvm_mcp.py"}